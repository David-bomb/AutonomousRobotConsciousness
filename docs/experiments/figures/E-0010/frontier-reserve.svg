<rect x="55" y="523" width="17" height="17" rx="2" fill="none" stroke="#416db0" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="78" y="537" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#4d625f">обзор 3×3</text>
