<text x="1084" y="41" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="600" fill="#1b302e" text-anchor="end">frontier-reserve</text>
<text x="32" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="41" font-weight="700" fill="#1b302e">Разведка с дорогой обратно</text>
<text x="34" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#4d625f">Робот ищет место, откуда увидит новые клетки и ещё сможет добраться до сервисов.</text>
