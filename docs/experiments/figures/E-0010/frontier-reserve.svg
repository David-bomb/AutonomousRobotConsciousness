<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="742" viewBox="0 0 1120 742" role="img" aria-labelledby="title desc" xml:lang="ru"><title id="title">Разведка с дорогой обратно · frontier-reserve</title><desc id="desc">Ход 14, карта H1-01. Робот в клетке (17,17). По известной дороге два хода на север до мастерской. Оттуда шесть ходов до заправки и шесть обратно. На карте показаны память и текущий обзор.</desc>
