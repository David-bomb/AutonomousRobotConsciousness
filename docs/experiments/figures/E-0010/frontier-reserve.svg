<text x="315.5" y="537" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#754109" text-anchor="middle">З</text>
<text x="330" y="537" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#4d625f">заправка</text>
<line x1="57" y1="563" x2="79" y2="563" stroke="#006e60" stroke-width="3.4" />
<text x="86" y="568" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#006e60">выбранный ход</text>
<text x="498" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="650" fill="#1b302e">Можно ли съездить на разведку?</text>
<text x="498" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">Финиш пока вне сети известных дорог.</text>
<circle cx="511" cy="250" r="13" fill="#e0efe8" stroke="none" stroke-width="0"/>
<text x="511" y="254.9" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#006e60" text-anchor="middle">1</text>
<text x="535" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#1b302e">Найти новое окно</text>
<text x="535" y="281" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">Через 2 хода на север — мастерская у края памяти.</text>
<circle cx="511" cy="333" r="13" fill="#e0efe8" stroke="none" stroke-width="0"/>
<text x="511" y="337.9" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#006e60" text-anchor="middle">2</text>
<text x="535" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#1b302e">Рассчитать остаток</text>
<text x="535" y="364" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">До поездки 15 топлива и 7 исправности. После двух</text>
<circle cx="511" cy="418" r="13" fill="#e0efe8" stroke="none" stroke-width="0"/>
<text x="511" y="422.9" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#006e60" text-anchor="middle">3</text>
<text x="535" y="423" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#1b302e">Проверить дорогу обратно</text>
<text x="535" y="449" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">От мастерской 6 ходов по известной дороге до</text>
<text x="535" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">ходов и ремонта остаются 13 и 100.</text>
<text x="535" y="475" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">заправки. Ещё 6 — назад к мастерской.</text>
<line x1="498" y1="504" x2="1047" y2="504" stroke="#d9e1dc" stroke-width="1" />
<text x="498" y="534" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#006e60">Такой выезд откроет клетки и оставит дорогу</text>
<text x="498" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#006e60">к обоим видам обслуживания.</text>
<rect x="32" y="605" width="1056" height="109" rx="15" fill="#183d36" />
<text x="56" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#9fd6bc" letter-spacing="1.35">РЕЗУЛЬТАТ ПОЕЗДКИ</text>
<text x="56" y="664" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#fff">Первый ход на север. Через два хода робот в мастерской.</text>
<text x="56" y="694" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#d1e5d9">H1-01 пройдена за 60 ходов, с одной заправкой и двумя ремонтами.</text>
<line x1="822" y1="621" x2="822" y2="699" stroke="#4b6e60" stroke-width="1" />
<text x="843" y="637" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="650" fill="#aecabe" letter-spacing="1">СОТНИ I / II / III</text>
<text x="843" y="662" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="650" fill="#fff">57 / 53 / 49</text>
<text x="843" y="692" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="500" fill="#cce4d6">val   35 / 36</text>
