<text x="263" y="568" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#a3531d">ход родителя</text>
<text x="498" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="650" fill="#1b302e">После какого хода возможен финиш?</text>
<text x="498" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">Исправность 6. До ближайшей мастерской 5 ходов.</text>
<text x="498" y="251" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1b302e">Оставить схемы с точными длинами путей</text>
<text x="498" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4d625f">Сейчас до заправки и мастерской 8 и 5 ходов.</text>
<text x="498" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">Из предыдущей клетки было 9 и 6. Подошли две схемы.</text>
<text x="507" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4d625f">Гипотеза</text>
<text x="714" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4d625f">На восток</text>
<text x="888" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4d625f">На юг</text>
<line x1="498" y1="361" x2="1047" y2="361" stroke="#d9e1dc" stroke-width="1" />
<text x="507" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#1b302e">Схема 1</text>
<text x="714" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#1b302e">можно</text>
<text x="888" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#006e60">можно</text>
<rect x="496" y="413" width="552" height="38" rx="7" fill="#eaf4ed" />
<text x="507" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#1b302e">Схема 2</text>
<text x="714" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#1b302e">нет пути</text>
<text x="888" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#006e60">можно</text>
<line x1="498" y1="460" x2="1047" y2="460" stroke="#d9e1dc" stroke-width="1" />
<text x="498" y="496" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1b302e">Юг сохраняет путь до финиша в обеих схемах.</text>
<text x="498" y="528" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4d625f">Робот менял число горизонтальных и вертикальных</text>
<text x="498" y="552" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4d625f">проходов по отдельности. Геометрия за окном неизвестна.</text>
<rect x="32" y="605" width="1056" height="109" rx="15" fill="#183d36" />
<text x="56" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#9fd6bc" letter-spacing="1.35">РЕЗУЛЬТАТ ПОЕЗДКИ</text>
<text x="56" y="664" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#fff">На ходу 20 робот сворачивает на юг и финиширует на ходу 61.</text>
<text x="56" y="694" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#d1e5d9">Родитель dominant-loops поехал на восток и исчерпал исправность на ходу 25.</text>
