<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="742" viewBox="0 0 1120 742" role="img" aria-labelledby="title desc" xml:lang="ru"><title id="title">Поворот по возможным схемам дорог · axis-loops</title><desc id="desc">Ход 20 на H2-02. После раздельного перебора горизонтальных и вертикальных проходов два варианта соответствуют датчикам. В первом финиш возможен после востока и юга, во втором только после юга. Выбран юг.</desc>
