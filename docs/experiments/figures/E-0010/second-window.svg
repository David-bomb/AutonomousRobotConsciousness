<text x="263" y="568" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#a3531d">ход родителя</text>
<text x="498" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="650" fill="#1b302e">Какое окно проверить первым?</text>
<text x="498" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">Из окна А до окна Б три хода по известной дороге.</text>
<text x="498" y="251" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1b302e">Для каждого окна робот складывает две оценки</text>
<text x="498" y="279" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4d625f">Прямой путь к финишу + шанс тупика × оценка</text>
<text x="498" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4d625f">лучшего запасного окна с оставшимися ресурсами.</text>
<text x="507" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4d625f">Первый выезд</text>
<text x="704" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4d625f">Только это окно</text>
<text x="876" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4d625f">С запасным окном</text>
<line x1="498" y1="361" x2="1047" y2="361" stroke="#d9e1dc" stroke-width="1" />
