<text x="887" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#006e60">0,221</text>
<text x="507" y="441" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#1b302e">Б   ·   запад</text>
<text x="710" y="441" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#1b302e">0,198</text>
<text x="887" y="441" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#1b302e">0,199</text>
<line x1="498" y1="460" x2="1047" y2="460" stroke="#d9e1dc" stroke-width="1" />
<text x="498" y="496" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#1b302e">Окно Б лучше само по себе. Из А хватает топлива</text>
<text x="498" y="521" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#1b302e">проверить Б, если первый осмотр не откроет ход.</text>
<text x="498" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#4d625f">Числа — оценки модели для этого хода.</text>
<rect x="32" y="605" width="1056" height="109" rx="15" fill="#183d36" />
<text x="56" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#9fd6bc" letter-spacing="1.35">РЕЗУЛЬТАТ ПОЕЗДКИ</text>
<text x="56" y="664" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#fff">На ходу 1051 робот едет на восток. Финиш на ходу 1077.</text>
<text x="56" y="694" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#d1e5d9">Родитель specific-paths поехал на запад и исчерпал топливо на ходу 1084.</text>
