<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="742" viewBox="0 0 1120 742" role="img" aria-labelledby="title desc" xml:lang="ru"><title id="title">Выезд с запасным окном · second-window</title><desc id="desc">Ход 1051 на карте H3-22. Западный маршрут к окну Б лидирует по одному окну. После учёта запасного выхода восточное окно А получает оценку 0,221 против 0,199. Робот делает один ход на восток.</desc>
