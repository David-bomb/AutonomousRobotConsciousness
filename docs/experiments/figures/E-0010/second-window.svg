<text x="49" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#006e60" letter-spacing="1.5">E-0010   /   СТРАТЕГИЯ 1</text>
<text x="1084" y="41" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="600" fill="#1b302e" text-anchor="end">second-window</text>
<text x="32" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="41" font-weight="700" fill="#1b302e">Выезд с запасным окном</text>
<text x="34" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#4d625f">Робот сравнивает места для следующего осмотра и оценивает, куда сможет поехать из тупика.</text>
