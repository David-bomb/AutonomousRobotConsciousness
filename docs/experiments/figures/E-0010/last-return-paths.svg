<text x="1084" y="41" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="600" fill="#1b302e" text-anchor="end">last-return-paths</text>
<text x="32" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="41" font-weight="700" fill="#1b302e">Что делать после неудачной пробы</text>
<text x="34" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#4d625f">После возврата робот проверяет, хватит ли ресурсов ещё на один пробный ход и обратный путь.</text>
