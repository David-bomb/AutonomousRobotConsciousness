<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="742" viewBox="0 0 1120 742" role="img" aria-labelledby="title desc" xml:lang="ru"><title id="title">Что делать после неудачной пробы · last-return-paths</title><desc id="desc">Ход 3 на H1-16. После разведки и возврата осталось 25 топлива и 41 исправности. Ближайшая заправка в 22 ходах. Три лишних хода позволяют сохранить обычное решение — восток. Если запаса на два хода нет, робот заново сравнивает подходы к сервису.</desc>
