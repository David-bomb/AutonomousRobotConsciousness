<text x="86" y="568" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#006e60">выбранный ход</text>
<line x1="235" y1="563" x2="256" y2="563" stroke="#a3531d" stroke-width="2.6" stroke-dasharray="4 3"/>
<text x="263" y="568" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#a3531d">ход родителя</text>
<text x="498" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="650" fill="#1b302e">Можно ли позволить ещё одну пробу?</text>
<text x="498" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">Первые два хода вернули робота в исходную клетку.</text>
<text x="498" y="251" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#1b302e">Посчитать запас сверх дороги до заправки</text>
<text x="498" y="281" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4d625f">Топливо 25, до заправки 22 хода. Исправность 41.</text>
<text x="498" y="307" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4d625f">Первым закончится топливо. Свободны 3 хода.</text>
<rect x="496" y="337" width="552" height="76" rx="8" fill="#eaf4ed"/>
<text x="509" y="364" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#006e60">Есть хотя бы 2 лишних хода</text>
<text x="509" y="392" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1b302e">Сохранить обычный выбор после возврата. Здесь — восток.</text>
<text x="509" y="449" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#1b302e">Остаётся меньше 2 лишних ходов</text>
<text x="509" y="477" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#1b302e">Заново сравнить оставшиеся направления к сервису.</text>
<line x1="498" x2="1047" y1="502" y2="502" stroke="#d9e1dc"/>
<text x="498" y="533" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">На check-H3-24 до ремонта 10 ходов при исправности 10.</text>
<text x="498" y="556" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#4d625f">Там повторная оценка сменила запад на восток.</text>
<rect x="32" y="605" width="1056" height="109" rx="15" fill="#183d36" />
<text x="56" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#9fd6bc" letter-spacing="1.35">РЕЗУЛЬТАТ ПОЕЗДКИ</text>
<text x="56" y="664" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#fff">На ходу 3 робот едет на восток и финиширует на ходу 65.</text>
<text x="56" y="694" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#d1e5d9">Родитель return-paths поехал на юго-восток и исчерпал топливо на ходу 27.</text>
<line x1="822" y1="621" x2="822" y2="699" stroke="#4b6e60" stroke-width="1" />
<text x="843" y="637" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="650" fill="#aecabe" letter-spacing="1">СОТНИ I / II / III</text>
<text x="843" y="662" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="650" fill="#fff">74 / 75 / 73</text>
<text x="843" y="692" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="500" fill="#cce4d6">val   36 / 36</text>
